name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: blacksmith
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md

  skill-validation:
    name: Skill Validation
    runs-on: blacksmith
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate SKILL frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          skill_files = sorted(Path("skills").rglob("SKILL.md"))
          if not skill_files:
              print("No skills/**/SKILL.md files found")
              sys.exit(1)

          required = ["name", "description"]
          allowed_categories = {"engineering", "productivity", "misc"}
          errors = []

          for skill_path in skill_files:
              text = skill_path.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---\n", text, flags=re.DOTALL)
              if not match:
                  errors.append(f"{skill_path}: must start with YAML frontmatter delimited by ---")
                  continue

              # Naive YAML key parse, tolerant of folded `>` blocks for description.
              raw = match.group(1)
              keys = {}
              current_key = None
              for line in raw.splitlines():
                  if not line.strip():
                      continue
                  if line.startswith((" ", "\t")) and current_key:
                      keys[current_key] = (keys[current_key] + " " + line.strip()).strip()
                      continue
                  if ":" not in line:
                      continue
                  k, v = line.split(":", 1)
                  current_key = k.strip()
                  v = v.strip()
                  if v in (">", "|"):
                      keys[current_key] = ""
                  else:
                      keys[current_key] = v.strip('"').strip("'")

              missing = [k for k in required if not keys.get(k)]
              if missing:
                  errors.append(f"{skill_path}: missing frontmatter keys: {', '.join(missing)}")
                  continue

              skill_dir = skill_path.parent.name
              if keys["name"] != skill_dir:
                  errors.append(
                      f"{skill_path}: frontmatter name '{keys['name']}' "
                      f"does not match directory '{skill_dir}'"
                  )
                  continue

              # Expect skills/<category>/<skill-name>/SKILL.md
              parts = skill_path.parts
              if len(parts) >= 3 and parts[0] == "skills":
                  category = parts[1]
                  if category not in allowed_categories:
                      errors.append(
                          f"{skill_path}: category '{category}' not in "
                          f"{sorted(allowed_categories)}"
                      )
                      continue

              print(f"OK  {skill_path}")

          if errors:
              print("\nValidation failed:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print(f"\nAll {len(skill_files)} skill(s) validated.")
          PY
      - name: Validate UI Studio tooling
        run: |
          python skills/engineering/ui-studio/scripts/validate-kit.py \
            --check-files skills/engineering/ui-studio/fixtures/reference-ui
          python skills/engineering/ui-studio/scripts/doctor.py \
            --root skills/engineering/ui-studio/fixtures/reference-ui \
            --json > /tmp/ui-studio-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/ui-studio-doctor.json").read_text(encoding="utf-8")
          )
          assert report["kits"][0]["schemaValid"] is True
          assert report["packages"][0]["runnableUi"] is True
          PY
          python skills/engineering/ui-studio/scripts/test-tooling.py
          python skills/engineering/ui-studio/scripts/check-evidence.py \
            skills/engineering/ui-studio/fixtures/reference-ui/docs/evidence.json
          python skills/engineering/ui-studio/scripts/check-integrations.py \
            skills/engineering/ui-studio/fixtures/reference-ui/docs/integrations.json \
            --release
          python skills/engineering/ui-studio/scripts/validate-kit.py \
            --schema benchmark \
            skills/engineering/ui-studio/fixtures/benchmark/benchmark.json
          python skills/engineering/ui-studio/scripts/benchmark.py plan \
            skills/engineering/ui-studio/fixtures/benchmark/benchmark.json
          python skills/engineering/ui-studio/scripts/check-portability.py
          python skills/engineering/ui-studio/scripts/tokens.py validate \
            skills/engineering/ui-studio/fixtures/portability/kit/src/tokens.json
          bash -n \
            skills/engineering/ui-studio/scripts/dogfood.sh \
            skills/engineering/ui-studio/scripts/dogfood-portability.sh \
            skills/engineering/ui-studio/scripts/sandbox-reference.sh
          skills/engineering/ui-studio/scripts/dogfood-portability.sh
